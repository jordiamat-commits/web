<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juego de monedas</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#87CEEB;
    text-align:center;
}

h1{
    margin:15px 0;
    font-size:48px;
    color:white;
}

#juego{
    position:relative;
    width:900px;
    height:550px;
    margin:auto;
    background:#dff6ff;
    border:5px solid #333;
    overflow:hidden;
}

#cesta{
    position:absolute;
    bottom:15px;
    left:400px;
    font-size:70px;
}

.moneda{
    position:absolute;
    font-size:40px;
}

#puntos{
    font-size:30px;
    margin:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>🪙 Juego de monedas</h1>

<div id="puntos">Puntos: 0</div>

<div id="juego">
    <div id="cesta">🧺</div>
</div>

<script>

const juego=document.getElementById("juego");
const cesta=document.getElementById("cesta");
const puntosTexto=document.getElementById("puntos");

let puntos=0;
let x=400;

document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft") x-=30;
    if(e.key==="ArrowRight") x+=30;

    if(x<0)x=0;
    if(x>820)x=820;

    cesta.style.left=x+"px";
});

function crearMoneda(){

    const moneda=document.createElement("div");
    moneda.className="moneda";
    moneda.innerHTML="🪙";

    let mx=Math.random()*850;
    let my=0;

    moneda.style.left=mx+"px";
    moneda.style.top=my+"px";

    juego.appendChild(moneda);

    const caer=setInterval(()=>{

        my+=2;   // ← velocidad lenta

        moneda.style.top=my+"px";

        if(my>470 &&
           mx>x-20 &&
           mx<x+70){

            puntos++;
            puntosTexto.innerHTML="Puntos: "+puntos;

            moneda.remove();
            clearInterval(caer);

        }

        if(my>550){
            moneda.remove();
            clearInterval(caer);
        }

    },20);

}

setInterval(crearMoneda,1200);

</script>

</body>
</html>
