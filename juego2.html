<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego 2</title>

<style>
body{
    background:#87CEEB;
    text-align:center;
    font-family:Arial;
}

canvas{
    background:white;
    border:4px solid black;
}
</style>
</head>

<body>

<h1>🪙 Juego 2 - Atrapa la moneda</h1>

<canvas id="juego" width="400" height="500"></canvas>

<script>

const canvas=document.getElementById("juego");
const ctx=canvas.getContext("2d");

let cesta=170;
let monedaX=Math.random()*360;
let monedaY=0;
let puntos=0;

document.addEventListener("keydown",function(e){

if(e.key=="ArrowLeft") cesta-=20;
if(e.key=="ArrowRight") cesta+=20;

if(cesta<0)cesta=0;
if(cesta>320)cesta=320;

});

function dibujar(){

ctx.clearRect(0,0,400,500);

ctx.font="25px Arial";
ctx.fillText("Puntos: "+puntos,10,30);

ctx.fillStyle="brown";
ctx.fillRect(cesta,460,80,20);

ctx.font="30px Arial";
ctx.fillText("🪙",monedaX,monedaY);

monedaY+=3;

if(monedaY>450 && monedaX>cesta && monedaX<cesta+80){

puntos++;
monedaY=0;
monedaX=Math.random()*360;

}

if(monedaY>500){

monedaY=0;
monedaX=Math.random()*360;

}

requestAnimationFrame(dibujar);

}

dibujar();

</script>

</body>
</html>
