let cuentaAtras = 3;
let jugando = false;
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Atrapa Monedas</title>

<style>
body{
    margin:0;
    background:skyblue;
    text-align:center;
    font-family:Arial;
}

h1{
    color:white;
}

canvas{
    background:#87CEEB;
    border:4px solid white;
}
</style>
</head>

<body>

<h1>🪙 Atrapa Monedas</h1>

<h2 id="puntos">Puntos: 0</h2>

<canvas id="juego" width="600" height="500"></canvas>

<script>

const canvas=document.getElementById("juego");
const ctx=canvas.getContext("2d");

let puntos=0;
let velocidad=3;

let cesta={
    x:250,
    y:450,
    ancho:100,
    alto:20
};

let monedas=[
    {x:100,y:-50},
    {x:350,y:-250}
];

document.addEventListener("keydown",function(e){

    if(e.key=="ArrowLeft"){
        cesta.x-=30;
    }

    if(e.key=="ArrowRight"){
        cesta.x+=30;
    }

});

function dibujar(){

    ctx.clearRect(0,0,600,500);

    ctx.fillStyle="brown";
    ctx.fillRect(cesta.x,cesta.y,cesta.ancho,cesta.alto);

    for(let i=0;i<monedas.length;i++){

        monedas[i].y+=velocidad;

        ctx.beginPath();
        ctx.arc(monedas[i].x,monedas[i].y,15,0,Math.PI*2);
        ctx.fillStyle="gold";
        ctx.fill();

        // Atrapar moneda
        if(
            monedas[i].y>430 &&
            monedas[i].x>cesta.x &&
            monedas[i].x<cesta.x+cesta.ancho
        ){

            puntos++;
            document.getElementById("puntos").innerHTML="Puntos: "+puntos;

            monedas[i].x=Math.random()*560+20;
            monedas[i].y=-Math.random()*300;

            if(puntos==10){
                monedas.push({
                    x:Math.random()*560+20,
                    y:-150
                });
            }

            if(puntos==20){
                velocidad=5;
            }
        }

        // Game Over
        if(monedas[i].y>500){
          ctx.fillStyle = "rgba(0,0,0,0.7)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle = "red";
ctx.font = "70px Arial";
ctx.textAlign = "center";
ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2);

ctx.fillStyle = "white";
ctx.font = "30px Arial";
ctx.fillText("Puntos: " + puntos, canvas.width/2, canvas.height/2 + 60);

return;
        }

    }

    requestAnimationFrame(dibujar);

}

dibujar();

</script>

</body>
</html>
