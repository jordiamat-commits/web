<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Juego de monedas</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#87CEEB;
    text-align:center;
}

h1{
    margin:15px;
    font-size:45px;
}

#puntos{
    font-size:28px;
    margin-bottom:10px;
}

#juego{
    position:relative;
    width:900px;
    height:550px;
    margin:auto;
    background:white;
    border:5px solid #333;
    overflow:hidden;
}

#cesta{
    position:absolute;
    bottom:15px;
    left:410px;
    font-size:70px;
}

#moneda{
    position:absolute;
    top:0;
    left:300px;
    font-size:45px;
}

#gameover{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.8);
    color:white;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

#gameover h2{
    font-size:70px;
    margin:0;
}

button{
    margin-top:30px;
    font-size:28px;
    padding:15px 35px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🪙 Juego de monedas</h1>

<div id="puntos">⭐ Puntos: 0</div>

<div id="juego">

<div id="moneda">🪙</div>

<div id="cesta">🧺</div>

<div id="gameover">
<h2>GAME OVER</h2>

<button onclick="window.location='juegos.html'">
⬅ Volver
</button>
</div>

</div>

<script>

let cesta=document.getElementById("cesta");
let moneda=document.getElementById("moneda");
let gameover=document.getElementById("gameover");
let puntosTexto=document.getElementById("puntos");

let cestaX=410;

let monedaX=Math.random()*820;
let monedaY=0;

let puntos=0;

document.addEventListener("keydown",function(e){

if(e.key=="ArrowLeft") cestaX-=35;
if(e.key=="ArrowRight") cestaX+=35;

if(cestaX<0)cestaX=0;
if(cestaX>820)cestaX=820;

cesta.style.left=cestaX+"px";

});

function nuevaMoneda(){

monedaX=Math.random()*820;
monedaY=0;

moneda.style.left=monedaX+"px";
moneda.style.top="0px";

}

let juego=setInterval(function(){

monedaY+=2;   // velocidad lenta

moneda.style.top=monedaY+"px";

if(monedaY>470 &&
monedaX>cestaX-20 &&
monedaX<cestaX+70){

puntos++;

puntosTexto.innerHTML="⭐ Puntos: "+puntos;

setTimeout(nuevaMoneda,400);

}

if(monedaY>520){

clearInterval(juego);

gameover.style.display="flex";

}

},20);

nuevaMoneda();

</script>

</body>
</html>
