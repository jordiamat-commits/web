<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Pixel Games - Juegos</title>

<style>
body{
    background:#ff8c00;
    font-family:Arial,sans-serif;
    margin:0;
    color:white;
    text-align:center;
}

h1{
    padding:30px;
    font-size:50px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,220px);
    gap:30px;
    justify-content:center;
    margin-top:30px;
}

.juego{
    width:220px;
    height:220px;
    background:#ffffff;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    color:#007bff;
    font-size:24px;
    font-weight:bold;
    transition:0.3s;
}

.juego:hover{
    background:#d9ecff;
    transform:scale(1.05);
}
</style>

</head>

<body>

<h1>🎮 Pixel Games</h1>

<div class="grid">

<a href="#" class="juego">Juego 1</a>

<a href="#" class="juego">Juego 2</a>

<a href="#" class="juego">Juego 3</a>

<a href="#" class="juego">Juego 4</a>

<a href="#" class="juego">Juego 5</a>

<a href="#" class="juego">Juego 6</a>

</div>

</body>
</html>
