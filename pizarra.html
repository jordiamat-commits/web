#campo{

.linea{

#circulo{
position:absolute;

top:50%;

height:160px;

border-radius:50%;
transform:translate(-50%,-50%);

#punto{
position:absolute;
left:50%;
top:50%;

height:10px;
background:white;
border-radius:50%;

}

.area{

width:170px;

top:200px;
}

#izq{
left:0;
border-left:none;
}

#der{
right:0;
border-right:none;
}

.ficha{
position:absolute;
width:42px;
height:42px;
border-radius:50%;
cursor:grab;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
color:white;
user-select:none;
}

.roja{
background:#d50000;
}

.azul{
background:#004cff;
}

.balon{
background:white;
color:black;
border:2px solid black;
}

</style>
</head>

<body>

  <script>
const fichas = document.querySelectorAll(".ficha");

fichas.forEach(ficha => {

let mover = false;
let offsetX = 0;
let offsetY = 0;

ficha.addEventListener("mousedown", function(e){
    mover = true;
    offsetX = e.offsetX;
    offsetY = e.offsetY;
    ficha.style.cursor = "grabbing";
});

document.addEventListener("mousemove", function(e){
    if(!mover) return;

    const campo = document.getElementById("campo");
    const rect = campo.getBoundingClientRect();

    ficha.style.left = (e.clientX - rect.left - offsetX) + "px";
    ficha.style.top = (e.clientY - rect.top - offsetY) + "px";
});

document.addEventListener("mouseup", function(){
    mover = false;
    ficha.style.cursor = "grab";
});

});
</script>
