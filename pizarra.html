<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pizarra Magnética</title>

<style>

body{
margin:0;
background:#1b1b1b;
font-family:Arial;
overflow:hidden;
}

h1{
margin:10px;
text-align:center;
color:white;
}

#campo{

position:relative;

width:1200px;
height:700px;

margin:auto;

border:6px solid white;

background:
repeating-linear-gradient(
90deg,
#3ca84a 0px,
#3ca84a 60px,
#46b956 60px,
#46b956 120px);

overflow:hidden;

}

/* Línea central */

#linea{
position:absolute;
left:50%;
top:0;
width:3px;
height:100%;
background:white;
transform:translateX(-50%);
}

/* Círculo central */

#circulo{
position:absolute;
left:50%;
top:50%;
width:170px;
height:170px;
border:3px solid white;
border-radius:50%;
transform:translate(-50%,-50%);
}

/* Punto central */

#punto{
position:absolute;
left:50%;
top:50%;
width:10px;
height:10px;
background:white;
border-radius:50%;
transform:translate(-50%,-50%);
}

/* Área izquierda */

#area1{
position:absolute;
left:0;
top:170px;
width:170px;
height:360px;
border:3px solid white;
}

/* Área derecha */

#area2{
position:absolute;
right:0;
top:170px;
width:170px;
height:360px;
border:3px solid white;
}

/* Área pequeña */

#pequena1{
position:absolute;
left:0;
top:255px;
width:70px;
height:190px;
border:3px solid white;
}

#pequena2{
position:absolute;
right:0;
top:255px;
width:70px;
height:190px;
border:3px solid white;
}

/* Porterías */

#porteria1{
position:absolute;
left:-18px;
top:270px;
width:18px;
height:160px;
border:3px solid white;
}

#porteria2{
position:absolute;
right:-18px;
top:270px;
width:18px;
height:160px;
border:3px solid white;
}

/* Fichas */

.ficha{

position:absolute;

width:34px;
height:34px;

border-radius:50%;

display:flex;

justify-content:center;
align-items:center;

font-weight:bold;
font-size:15px;

cursor:grab;

user-select:none;

box-shadow:0 0 10px rgba(0,0,0,.5);

}

.rojo{
background:#d50000;
color:white;
}

.azul{
background:#0d47a1;
color:white;
}

.balon{
background:white;
font-size:22px;
}

.conoAmarillo{

background:gold;
border-radius:8px;

}

.conoVerde{

background:#00c853;
border-radius:8px;

}

.entrenador{

background:black;
color:white;

}

.arbitro{

background:#555;
color:white;

}

.banquillo{

width:90px;
height:35px;

background:#795548;

border-radius:8px;

color:white;

font-size:13px;

}

#volver{

position:fixed;

top:10px;
left:10px;

padding:10px 20px;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<button id="volver"
onclick="location.href='futbol.html'">

🔙 Volver

</button>

<h1>⚽ PIZARRA MAGNÉTICA</h1>

<div id="campo">

<div id="linea"></div>

<div id="circulo"></div>

<div id="punto"></div>

<div id="area1"></div>

<div id="area2"></div>

<div id="pequena1"></div>

<div id="pequena2"></div>

<div id="porteria1"></div>

<div id="porteria2"></div>
