<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego 1</title>

<style>
body{
    background: orange;
    text-align: center;
    font-family: Arial;
}

h1{
    color: white;
}

canvas{
    background: white;
    border: 4px solid black;
}
</style>

</head>
<body>

<h1>🍓 Juego 1</h1>

<canvas id="juego" width="400" height="500"></canvas>

<script>

const canvas = document.getElementById("juego");
const ctx = canvas.getContext("2d");

ctx.font = "50px Arial";
ctx.fillText("🍓",170,100);

</script>

</body>
</html>
