<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego de carreras</title>

<style>
body{
margin:0;
background:#2e8b57;
font-family:Arial;
text-align:center;
}

h1{
color:white;
font-size:45px;
margin:15px;
}

#puntos{
color:white;
font-size:28px;
margin-bottom:10px;
}

#carretera{
position:relative;
width:500px;
height:700px;
margin:auto;
background:#555;
overflow:hidden;
border:6px solid white;
}

.linea{
position:absolute;
left:240px;
width:20px;
height:80px;
background:white;
}

#coche{
position:absolute;
bottom:20px;
left:210px;
font-size:60px;
}
</style>

</head>
<body>

<h1>🏎️ Juego de carreras</h1>

<div id="puntos">⭐ Puntos: 0</div>

<div id="carretera">

<div class="linea" style="top:0"></div>
<div class="linea" style="top:140px"></div>
<div class="linea" style="top:280px"></div>
<div class="linea" style="top:420px"></div>
<div class="linea" style="top:560px"></div>

<div id="coche">🏎️</div>

</div>

<script>

let coche=document.getElementById("coche");
let x=210;

document.addEventListener("keydown",function(e){

if(e.key=="ArrowLeft")x-=40;

if(e.key=="ArrowRight")x+=40;

if(x<20)x=20;

if(x>420)x=420;

coche.style.left=x+"px";

});

</script>

</body>
</html>
