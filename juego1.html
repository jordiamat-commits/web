

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Juego 1</title>

<style>
body{
    background:orange;
    font-family:Arial;
    text-align:center;
}

canvas{
    background:white;
    border:4px solid black;
}
</style>

</head>

<body>

<h1>🍓 Juego 1</h1>

<canvas id="juego" width="400" height="500"></canvas>

<script>

const canvas=document.getElementById("juego");
const ctx=canvas.getContext("2d");

let x=200;

document.addEventListener("mousemove",function(e){
    x=e.clientX;
});

function dibujar(){

    ctx.clearRect(0,0,400,500);

    ctx.font="40px Arial";
    ctx.fillText("🍓",x-20,80);

    requestAnimationFrame(dibujar);

}

dibujar();

</script>

</body>
</html>
