<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Practicar Fútbol</title>

<style>

body{
    margin:0;
    background:#1b5e20;
    text-align:center;
    font-family:Arial;
}

h1{
    color:white;
}

#campo{
    display:block;
    margin:20px auto;
    border:6px solid white;
    background:#3fa34d;
}

button{
    font-size:22px;
    padding:15px 30px;
    margin:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
}

#entrenar{
    background:#4CAF50;
    color:white;
}

#pizarra{
    background:#1976D2;
    color:white;
}

</style>
</head>

<body>

<h1>⚽ Practicar fútbol</h1>

<canvas id="campo" width="1000" height="600"></canvas>

<br>

<button id="entrenar">⚽ Empezar a entrenar</button>

<button id="pizarra">🧲 Pizarra magnética</button>

<script>

const canvas=document.getElementById("campo");
const ctx=canvas.getContext("2d");

function dibujarCampo(){

    // Franjas de césped
    for(let i=0;i<10;i++){

        if(i%2==0){
            ctx.fillStyle="#43A047";
        }else{
            ctx.fillStyle="#66BB6A";
        }

        ctx.fillRect(i*100,0,100,600);
    }

    ctx.strokeStyle="white";
    ctx.lineWidth=4;

    // Bordes
    ctx.strokeRect(20,20,960,560);

    // Medio campo
    ctx.beginPath();
    ctx.moveTo(500,20);
    ctx.lineTo(500,580);
    ctx.stroke();

    // Círculo central
    ctx.beginPath();
    ctx.arc(500,300,70,0,Math.PI*2);
    ctx.stroke();

    // Punto central
    ctx.beginPath();
    ctx.arc(500,300,4,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    // Área izquierda
    ctx.strokeRect(20,170,160,260);

    // Área pequeña izquierda
    ctx.strokeRect(20,240,60,120);

    // Punto penalti izquierda
    ctx.beginPath();
    ctx.arc(130,300,4,0,Math.PI*2);
    ctx.fill();

    // Área derecha
    ctx.strokeRect(820,170,160,260);

    // Área pequeña derecha
    ctx.strokeRect(920,240,60,120);

    // Punto penalti derecha
    ctx.beginPath();
    ctx.arc(870,300,4,0,Math.PI*2);
    ctx.fill();

    // Porterías
    ctx.strokeRect(5,250,15,100);
    ctx.strokeRect(980,250,15,100);

}

dibujarCampo();

</script>

</body>
    
</html>
document.getElementById("entrenar").addEventListener("click", function () {
    window.location.href = "entrenar.html";
});

document.getElementById("pizarra").addEventListener("click", function () {
    window.location.href = "pizarra.html";
});
